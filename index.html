:root{--bg:#06070b;--ink:#eef0f8;--muted:#98a0b8;--faint:#7a8299;--glass:rgba(255,255,255,.055);--glass-2:rgba(255,255,255,.09);--edge:rgba(255,255,255,.11);--edge-2:rgba(255,255,255,.2);--lav:#c3b2ff;--sky:#8fc2ff;--mint:#8ff0c4;--peach:#ffb98a;--warn:#ffd37a;--bad:#ff9db8;--f-display:"Sora","Segoe UI",system-ui,sans-serif;--f-body:"DM Sans","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);padding:0 max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased}
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.glow i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(110px);opacity:.14}
.glow i:nth-child(1){background:var(--lav);left:-14vmax;top:-16vmax}.glow i:nth-child(2){background:var(--sky);right:-16vmax;top:6vmax;opacity:.22}.glow i:nth-child(3){background:var(--mint);left:22vmax;bottom:-26vmax;opacity:.16}
h1{font:600 clamp(22px,4vw,30px)/1.2 var(--f-display);letter-spacing:-.015em;margin:0}
button,input,summary{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-top:20px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.logo{background:#fff;border-radius:12px;padding:4px 8px;display:grid;place-items:center}.logo img{height:36px;width:auto;display:block}
.glass{position:relative;background:linear-gradient(135deg,rgba(18,22,34,.46),rgba(8,10,16,.34));border:1px solid rgba(255,255,255,.16);border-radius:22px;backdrop-filter:blur(3px) saturate(125%) brightness(.92);-webkit-backdrop-filter:blur(3px) saturate(125%) brightness(.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 40px rgba(255,255,255,.025),0 18px 50px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.10),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05))}
#board{position:fixed;inset:0;z-index:-2;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 55%,rgba(0,0,0,.8) 100%);mask-image:radial-gradient(ellipse at 50% 45%,#000 55%,rgba(0,0,0,.8) 100%)}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
.brand h1{text-shadow:0 2px 24px #000,0 0 2px #000}
.panel{padding:22px}.stack{display:grid;gap:14px;margin-top:18px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.form{display:grid;gap:20px}
.fields{display:grid;gap:14px;align-items:end;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.req{display:inline;color:var(--lav);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
input[type=number],input[type=date]{background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:12px;padding:11px 12px;color:var(--ink);font-size:16px;width:100%;min-height:44px}
input[type=date]{color-scheme:dark}
input:focus-visible,summary:focus-visible,.btn:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
.lvl{gap:8px}.lvl output{float:right;font:600 20px var(--f-mono);color:var(--ink)}
.lvl{position:relative}.lvl output{position:absolute;right:0;top:-4px}
input[type=range]{width:100%;accent-color:var(--lav);min-height:32px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}.ends i{font-style:normal}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.mode{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.03);cursor:pointer;color:var(--ink)}
.mode:has(input:checked){border-color:var(--lav);background:rgba(195,178,255,.1)}
.mode input{margin-top:4px;accent-color:var(--lav);width:18px;height:18px;flex:none}
.mode b{display:block;font:600 15px var(--f-display)}.mode i{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:2px}
.adj summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px}
.adj[open] summary{color:var(--ink)}
.cgrid{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:8px}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}.ci input{width:64px;min-height:38px;padding:6px 8px;text-align:center}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{background:var(--lav);color:#17142a;border:0;border-radius:999px;padding:12px 26px;font:600 15px var(--f-display);cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.err{color:var(--bad);font-size:14px}
.sum{color:var(--muted);font-size:15px}
.warn{border:1px solid rgba(255,211,122,.45);background:rgba(255,211,122,.1);color:var(--warn);border-radius:16px;padding:12px 16px}
.warn b{color:var(--warn)}
.note{border:1px solid var(--edge);background:var(--glass);border-radius:16px;padding:10px 16px;color:var(--muted);font-size:14px}.note.ok{color:var(--mint)}
.seq{padding:6px 8px;overflow:hidden}
.r{display:grid;grid-template-columns:34px minmax(140px,1.4fr) 214px 1fr .55fr .7fr 1.1fr 1.2fr;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid var(--edge);font-size:14px}
.r:first-child{border-top:0}
.r.hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-block:10px}
.r .n{font:500 13px var(--f-mono);color:var(--faint)}
.r .nm{font-weight:500}.r small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.act{color:var(--sky);font-size:13px}.q{color:var(--muted)}
.skp{padding:16px 20px}.skp summary{cursor:pointer;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{border:1px solid var(--edge);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
@media (max-width:820px){
 .r.hd{display:none}
 .r{grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"n nm h" ". st st" ". dt dt" ". w w" ". q q" ". act act";row-gap:4px}
